<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" class="bi bi-robot-animated" aria-labelledby="title desc" role="img">
    <title id="title">Animated robot logo</title>
    <desc id="desc">A robot icon with rounded rectangle eyes that scan side to side and blink by squashing smaller.</desc>

    <style>
        .shell {
            fill: #fff;
            transform-origin: 8px 8px;
            animation: bob 3.2s ease-in-out infinite;
        }

        .mouth {
            fill: none;
            stroke: #fff;
            stroke-width: 0.9;
            stroke-linecap: round;
            opacity: 0.9;
        }

        .eyes {
            transform-origin: 8px 7.5px;
            animation: blink 5.2s infinite;
        }

        .eye-socket {
            fill: white;
        }

        .pupil {
            fill: #333;
        }

        .pupil-left {
            animation: scanLeft 3.6s ease-in-out infinite;
        }

        .pupil-right {
            animation: scanRight 3.6s ease-in-out infinite;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-0.25px); }
        }

        @keyframes blink {
            0%, 43%, 47%, 74%, 78%, 100% { transform: scaleY(1); }
            44.5%, 75.5% { transform: scaleY(0.42); }
            46%, 77% { transform: scaleY(0.58); }
        }

        @keyframes scanLeft {
            0%, 100% { transform: translateX(-0.15px); }
            20% { transform: translateX(0.55px); }
            40% { transform: translateX(-0.35px); }
            65% { transform: translateX(0.65px); }
            82% { transform: translateX(0px); }
        }

        @keyframes scanRight {
            0%, 100% { transform: translateX(-0.15px); }
            20% { transform: translateX(0.55px); }
            40% { transform: translateX(-0.35px); }
            65% { transform: translateX(0.65px); }
            82% { transform: translateX(0px); }
        }
    </style>

    <defs>
        <clipPath id="leftEyeClip">
            <rect x="3.55" y="5.95" width="3.25" height="2.35" rx="0.9" />
        </clipPath>
        <clipPath id="rightEyeClip">
            <rect x="9.2" y="5.95" width="3.25" height="2.35" rx="0.9" />
        </clipPath>
    </defs>

    <path class="shell" d="M8.5 1.866a1 1 0 1 0-1 0V3h-2A4.5 4.5 0 0 0 1 7.5V8a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1v-.5A4.5 4.5 0 0 0 10.5 3h-2zM14 7.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.5A3.5 3.5 0 0 1 5.5 4h5A3.5 3.5 0 0 1 14 7.5" />

    <g class="eyes">
        <rect class="eye-socket" x="3.55" y="5.95" width="3.25" height="2.35" rx="0.9" />
        <rect class="eye-socket" x="9.2" y="5.95" width="3.25" height="2.35" rx="0.9" />

        <g clip-path="url(#leftEyeClip)">
            <rect class="pupil pupil-left" x="4.1" y="6.25" width="1.45" height="1.75" rx="0.55" />
        </g>

        <g clip-path="url(#rightEyeClip)">
            <rect class="pupil pupil-right" x="9.75" y="6.25" width="1.45" height="1.75" rx="0.55" />
        </g>
    </g>

    <path class="mouth" d="M6.35 11.85c.5.35 1.05.52 1.65.52s1.15-.17 1.65-.52" />
</svg>
