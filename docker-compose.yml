services:
  postgres:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: adocare
    volumes:
      - ./data-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  adminer:
    image: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_DB_DRIVER: pgsql
      ADMINER_DEFAULT_DB_HOST: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres

  ors:
    image: openrouteservice/openrouteservice:v8.0.0
    restart: unless-stopped
    mem_limit: 3g
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data-ors:/home/ors
    environment:
      REBUILD_GRAPHS: "true"
      XMS: 1g
      XMX: 2g
      "ors.engine.source_file": /home/ors/files/slovakia-260111.osm.pbf
      "ors.engine.profiles.car.enabled": "true"
    networks:
      - ors-net

  python-ors:
    build: ./python-ors
    container_name: python-ors
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512m

    ports:
      - "127.0.0.1:1515:1515"

    networks:
      - ors-net

    depends_on:
      - ors

  ocr:
    build: ../AI
    container_name: ocr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8000"
    volumes:
      - ./storage/app/private:/data:rw
      - ../AI/velvety-rarity-456212-b0-ce115e0647b9.json:/secrets/gcp.json:ro
    environment:
      OCR_ROOT: /data
      PORT: 8000
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp.json

volumes:
  data-db:
  data-ors:


networks:
  ors-net:
    driver: bridge
